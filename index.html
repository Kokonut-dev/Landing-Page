<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — Start Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="container">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-handle">@home</span>
        <span class="status-pill">
          <span class="status-dot"></span>
          <span>ONLINE</span>
        </span>
      </div>

      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme" title="Toggle Dark/Light Mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Hero: Clock, Greeting & Command Search -->
    <section class="hero">
      <div class="clock-wrap">
        <div id="clock" class="clock">00:00</div>
        <div id="date-greeting" class="date-greeting">Good evening · Loading...</div>
      </div>

      <form id="search-form" class="search-bar" autocomplete="off">
        <div class="engine-select-wrap">
          <select id="engine-select" class="engine-select" aria-label="Search engine">
            <option value="google">Google</option>
            <option value="duckduckgo">DuckDuckGo</option>
            <option value="github">GitHub</option>
            <option value="youtube">YouTube</option>
          </select>
        </div>
        <input
          id="search-input"
          class="search-input"
          type="text"
          placeholder="Search the web or press / to focus..."
          aria-label="Search"
        />
        <kbd class="search-kbd">/</kbd>
      </form>
    </section>

    <!-- Bento Grid -->
    <section class="bento-grid" aria-label="Quick Links">
      <!-- Quick Links Card -->
      <div class="bento-card bento-links">
        <div class="card-header">
          <span class="card-title">QUICK LAUNCH</span>
          <span class="card-meta">6 PINNED</span>
        </div>
        <div class="links-grid">
          <a href="https://github.com" class="link-tile" target="_blank" rel="noopener noreferrer">
            <span class="link-icon">GH</span>
            <span class="link-label">GitHub</span>
          </a>
          <a href="https://youtube.com" class="link-tile" target="_blank" rel="noopener noreferrer">
            <span class="link-icon">YT</span>
            <span class="link-label">YouTube</span>
          </a>
          <a href="https://figma.com" class="link-tile" target="_blank" rel="noopener noreferrer">
            <span class="link-icon">FG</span>
            <span class="link-label">Figma</span>
          </a>
          <a href="https://mail.google.com" class="link-tile" target="_blank" rel="noopener noreferrer">
            <span class="link-icon">GM</span>
            <span class="link-label">Gmail</span>
          </a>
          <a href="https://notion.so" class="link-tile" target="_blank" rel="noopener noreferrer">
            <span class="link-icon">NT</span>
            <span class="link-label">Notion</span>
          </a>
          <a href="https://x.com" class="link-tile" target="_blank" rel="noopener noreferrer">
            <span class="link-icon">X</span>
            <span class="link-label">X / Twitter</span>
          </a>
        </div>
      </div>

      <!-- Studio / Focus Card -->
      <div class="bento-card bento-focus">
        <div class="card-header">
          <span class="card-title">WORKSPACE</span>
          <span class="card-badge">READY</span>
        </div>
        <p class="focus-text">
          Minimalist start page built for speed, keyboard-first navigation, and clean motion.
        </p>
        <div class="socials-row">
          <a href="https://github.com" class="social-pill" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://instagram.com" class="social-pill" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="https://youtube.com" class="social-pill" target="_blank" rel="noopener noreferrer">YouTube</a>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
